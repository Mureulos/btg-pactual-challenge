services:
  rabbitmq:
    image: rabbitmq:management
    container_name: btg-challenge-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  mongodb:
    image: mongo:latest
    container_name: btg-challenge-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123
    volumes:
        - mongodb_data:/data/db

volumes:
  mongodb_data: